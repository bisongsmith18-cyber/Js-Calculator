<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Calculator</title>
    <link rel="stylesheet" href="styles/style.css" />
</head>

<body>

    <div class="calculator">
        <div class="display-container">
            <div class="memory" id="memory"></div>
            <div class="display" id="display">0</div>
        </div>


        <div class="buttons">
            <button class="gray" data-action="clear">AC</button>
            <button class="gray" data-action="delete">DEL</button>
            <button class="gray" data-action="percent">%</button>
            <button class="orange" data-action="operator">÷</button>

            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button class="orange" data-action="operator">×</button>

            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button class="orange" data-action="operator">−</button>

            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button class="orange" data-action="operator">+</button>

            <button class="zero" data-number="0">0</button>
            <button data-action="decimal">.</button>
            <button class="orange" data-action="equals">=</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
